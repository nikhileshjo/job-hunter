services:
  minio:
    container_name: "minio"
    image: minio/minio
  
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio

    command: >
      server /data --console-address :9001
    ports:
        - 9000:9000
        - 9001:9001
    volumes:
        - ./minio/data:/data
    
    restart: unless-stopped